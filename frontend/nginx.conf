server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Public quote widget: intentionally embeddable in an iframe on any company's own
    # website (there is no fixed list of customer domains to restrict framing to).
    # The SPA fallback uses a named location — try_files' plain "/index.html" target
    # would otherwise trigger an internal redirect that re-runs location matching and
    # falls into the strict "location /" block below, losing this CSP override.
    location ~ ^/q/ {
        add_header Content-Security-Policy "frame-ancestors *" always;
        try_files $uri @widget_spa_fallback;
    }

    location @widget_spa_fallback {
        add_header Content-Security-Policy "frame-ancestors *" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
